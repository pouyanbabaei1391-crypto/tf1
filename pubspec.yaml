name: nexadrop
description: Secure local file transfer for Android and Windows.
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: 13.1.0
  shared_preferences: 2.5.5
  permission_handler: 12.0.3
  cryptography: 2.9.0
  crypto: 3.0.7
  uuid: 4.6.0
  saf: 2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
